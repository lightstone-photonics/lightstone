<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <title>Lightstone</title>
  <!-- An "L" drawn by a light beam that bends like a fiber, ending in a bright dot. -->
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd1ff"/><stop offset="0.6" stop-color="#b18cff"/><stop offset="1" stop-color="#f6a03a"/></linearGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b1120"/>
  <path d="M20 10 L20 40 Q20 50 30 50 L52 50" fill="none" stroke="url(#beam)" stroke-width="7" stroke-linecap="round" filter="url(#g)"/>
  <circle cx="52" cy="50" r="4.5" fill="#fff" filter="url(#g)"/>
</svg>
