name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude lightstone-py --all-targets -- -D warnings
      # Validation tests V2–V13 (see docs/validation.md).
      - run: cargo test -p lightstone-core -p lightstone-analysis

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install numpy==2.1.3 scipy==1.14.1 pytest==8.3.3 maturin==1.7.4 matplotlib==3.9.2 nbformat==5.10.4 nbconvert==7.16.4 ipykernel==6.29.5
      - run: cd crates/lightstone-py && ../../.venv/bin/maturin develop --release
      # V1, V15 and API tests.
      - run: .venv/bin/python -m pytest -q tests/python
      - name: Figures up to date (non-blocking)
        run: |
          .venv/bin/python scripts/make_figures.py
          git diff --quiet docs/model/img || echo "::warning::docs/model/img differs from scripts/make_figures.py output; regenerate the figures"
      - name: Execute notebooks
        run: |
          .venv/bin/python -m ipykernel install --user --name python3
          cd notebooks && ../.venv/bin/jupyter nbconvert --to notebook --execute --output-dir /tmp/nb *.ipynb

  wheels:
    needs: [rust, python]
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/lightstone-py
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: crates/lightstone-py/dist

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: cd web && npm ci && npm test && npm run build
      # Browser test of the graph editor (headless Chromium).
      - name: Browser tests
        run: |
          cd web
          npm i --no-save playwright@1.65.0
          npx playwright install --with-deps chromium
          DIST=dist SCREENSHOT=/tmp/ci npm run e2e
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  pages:
    # Publish the browser editor on GitHub Pages after every push to main that passes CI.
    # Repository setting: Pages → Source: GitHub Actions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, python, web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  links:
    # Weekly, non-blocking reference link check (docs/architecture.md, Section 5.2).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_references.py
