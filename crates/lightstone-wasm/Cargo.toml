[package]
name = "lightstone-wasm"
description = "WebAssembly bindings for Lightstone"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lightstone-core.workspace = true
lightstone-analysis.workspace = true
serde.workspace = true
# Enables rustfft's WASM SIMD kernels for the whole dependency graph.
rustfft = { workspace = true, features = ["wasm_simd"] }
serde_json.workspace = true
num-complex.workspace = true
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
